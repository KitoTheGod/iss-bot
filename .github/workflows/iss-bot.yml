name: ISS radio-range bot

on:
  schedule:
    # Every 10 minutes, deliberately OFF the :00/:05 boundaries.
    #
    # GitHub's scheduler is best-effort: runs are delayed under load and are
    # sometimes dropped with no warning. Load peaks at the top of the hour and
    # on */5 boundaries - which is where every naive cron lands. Asking for odd
    # minutes puts us in a quieter queue and the runs actually happen.
    #
    # Because a run can still be skipped, the bot looks far enough ahead
    # (LEAD_MINUTES = 20) that a missed run does not mean a missed pass.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

# needed so the bot can commit state.json back and not repeat itself
permissions:
  contents: write

concurrency:
  group: iss-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check for a pass and post if there is one
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python iss_bot.py

      - name: Remember what we posted
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "iss-bot"
            git config user.email "iss-bot@users.noreply.github.com"
            git add state.json
            git commit -m "bot: announced a pass"
            git push
          else
            echo "nothing posted, state unchanged"
          fi
